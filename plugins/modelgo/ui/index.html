<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelGo</title>
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2f6bff; --accent-text: #ffffff; --ok: #12805c; --bad: #c0362c; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #1a1d23; --text: #eceef2; --muted: #9aa1ad; --line: #2b2f38;
      --accent: #5b8cff; --accent-text: #0b1020; --ok: #4cc79a; --bad: #ff8a80; --chip: #262a33;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 28px 16px 170px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: 20px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .step { width: 22px; height: 22px; border-radius: 50%; background: var(--chip); color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  .step.done { background: var(--ok); color: var(--card); }
  .row { display: flex; gap: 8px; }
  input[type=password], input[type=search] { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button.quiet { background: transparent; color: var(--accent); padding: 0 8px; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .hint a { color: var(--accent); }
  .msg { font-size: 13px; margin: 10px 0 0; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .saved { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .saved code { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .group { color: var(--muted); font-size: 12px; margin: 16px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  label.model { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--line); cursor: pointer; }
  label.model:first-of-type { border-top: 0; }
  label.model input { width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
  label.model .id { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { background: var(--chip); color: var(--muted); border-radius: 6px; padding: 1px 7px; font-size: 12px; white-space: nowrap; }
  .chip.warn { color: var(--bad); }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); }
  footer div { max-width: 680px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  footer span { color: var(--muted); font-size: 13px; }
  footer .msg { max-width: 680px; margin: 0 auto; padding: 10px 16px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/icon.png" alt="">
    <div><h1>ModelGo</h1><p data-t="subtitle"></p></div>
  </header>

  <section>
    <h2><span class="step" id="step1">1</span><span data-t="keyTitle"></span></h2>
    <div class="saved" id="keySaved" hidden>
      <span><span data-t="keySavedAs"></span> <code id="keyMasked"></code></span>
      <button class="quiet" id="keyChange" data-t="keyChange"></button>
    </div>
    <form id="keyForm" hidden>
      <div class="row">
        <input type="password" id="keyInput" autocomplete="off" spellcheck="false" placeholder="mgk_...">
        <button id="keySave" data-t="keySave"></button>
      </div>
      <p class="hint"><span data-t="keyHint"></span> <a id="consoleLink" target="_blank" rel="noreferrer">modelgo.ai</a></p>
    </form>
    <p class="msg" id="keyMsg" hidden></p>
  </section>

  <section id="modelsCard" hidden>
    <h2><span class="step" id="step2">2</span><span data-t="modelsTitle"></span></h2>
    <input type="search" id="search" style="width:100%">
    <div id="list"></div>
  </section>

  <p class="msg bad" id="pageMsg" hidden></p>
</main>

<footer id="bar" hidden>
  <p class="msg" id="modelsMsg" hidden></p>
  <div>
    <span id="count"></span>
    <button id="save" data-t="save"></button>
  </div>
</footer>
<script src="/app.js"></script>
</body>
</html>
